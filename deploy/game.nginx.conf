# 放在 Docker Nginx 容器的 /etc/nginx/conf.d/game.conf
# 配合 docker-compose 挂载使用
# proxy_pass 指向 docker 网桥网关（宿主机 pm2 进程）：
#   - 当前部署（8.130.53.51，master408_internal 网络）为 172.18.0.1
#   - 默认 bridge 网络为 172.17.0.1；其他环境按 `docker network inspect` 实际网关调整
server {
    listen 80;
    server_name game.wutiankai.cn;

    location / {
        proxy_pass http://172.18.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
